definitions:
  env_versions: &env_versions
    xcode: latest
    cocoapods: default

workflows:

  # ─── iOS: build & push to TestFlight (triggered on v* tags) ───────────────
  ios-release:
    name: iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: codemagic
    environment:
      <<: *env_versions
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.krishna.testAppCiCd
      vars:
        APPLE_TEAM_ID: "ZFMW2R7KJ9"
        APP_STORE_APPLE_ID: 6831504522
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true
    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - $HOME/.pub-cache
        - $HOME/.fvm
    scripts:
      - name: Setup FVM
        script: |
          dart pub global activate fvm
          fvm use stable --force
          fvm flutter --version
      - name: Get packages
        script: fvm flutter pub get
      - name: Install pods
        script: find . -name "Podfile" -execdir pod install \;
      - name: Test
        script: fvm flutter test
      - name: Apply signing
        script: xcode-project use-profiles
      - name: Set build number
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number \
            "$APP_STORE_APPLE_ID" || echo 0)
          echo "BUILD_NUMBER=$((LATEST + 1))" >> $CM_ENV
      - name: Build IPA
        script: |
          fvm flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - bhattacharyakrishna2010@gmail.com
