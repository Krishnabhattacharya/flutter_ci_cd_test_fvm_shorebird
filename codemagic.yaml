definitions:
  env_versions: &env_versions
    xcode: latest
    cocoapods: default

workflows:

  # ─── iOS: build & push to TestFlight (triggered on v* tags) ───────────────
  ios-release:
    name: iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: CodeMajic
    environment:
      <<: *env_versions
      groups:
        - app_config   # must contain CERTIFICATE_PRIVATE_KEY (secure)
      vars:
        BUNDLE_ID: "com.krishna.testAppCiCd"
        APPLE_TEAM_ID: "976G79796W"
        APP_STORE_APPLE_ID: 6831504522
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true
    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - $HOME/.pub-cache
        - $HOME/.fvm
    scripts:
      - name: Setup FVM
        script: |
          dart pub global activate fvm
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          fvm use stable --force
          fvm flutter --version
      - name: Get packages
        script: |
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          fvm flutter pub get
      - name: Install pods
        script: find . -name "Podfile" -execdir pod install \;
      - name: Test
        script: |
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          fvm flutter test
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Set build number
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number \
            "$APP_STORE_APPLE_ID" || echo 0)
          echo "BUILD_NUMBER=$((LATEST + 1))" >> $CM_ENV
      - name: Build IPA
        script: |
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          fvm flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - bhattacharyakrishna2010@gmail.com